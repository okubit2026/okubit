<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor Takibi – OKUBİT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap');

:root {
  --bg: #060d1a;
  --bg2: #0a1628;
  --lacivert: #0f2040;
  --accent: #00d4ff;
  --accent2: #0088bb;
  --gold: #ffd700;
  --green: #00ff88;
  --red: #ff4466;
  --orange: #ff8844;
  --purple: #aa44ff;
  --white: #e8f4ff;
  --grey: #6a8aaa;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--white);
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* Deep space background */
#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 12px;
}

/* ── HEADER ── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 12px;
  flex-shrink: 0;
}
.logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 3px;
  text-shadow: 0 0 20px rgba(0,212,255,0.5);
}
.logo span { color: var(--white); }
.score-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,212,255,0.1);
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: 20px;
  padding: 5px 12px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--accent);
}

/* ── SCREENS ── */
.screen { display:none; flex-direction:column; align-items:center; flex:1; overflow-y:auto; }
.screen.active { display:flex; }

/* ── MENU ── */
.game-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.3rem,5vw,2rem);
  font-weight: 900;
  text-align: center;
  margin: 16px 0 4px;
  color: var(--white);
  text-shadow: 0 0 30px rgba(0,212,255,0.5);
}
.game-sub {
  color: var(--grey);
  font-size: 0.8rem;
  letter-spacing: 2px;
  text-align: center;
  margin-bottom: 24px;
}
.meteor-preview {
  font-size: 2.5rem;
  margin-bottom: 20px;
  animation: floatY 3s ease-in-out infinite;
}
@keyframes floatY {
  0%,100% { transform: translateY(0) rotate(-15deg); }
  50% { transform: translateY(-10px) rotate(-15deg); }
}

.menu-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,212,255,0.15);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 440px;
  margin-bottom: 12px;
}
.menu-card h3 {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.68rem;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 14px;
  opacity: 0.8;
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 8px;
}
.lv-btn {
  background: rgba(0,212,255,0.05);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 10px;
  padding: 10px 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: var(--grey);
}
.lv-btn:hover, .lv-btn.sel {
  background: rgba(0,212,255,0.15);
  border-color: var(--accent);
  color: var(--white);
  box-shadow: 0 0 12px rgba(0,212,255,0.2);
}
.lv-btn .lv-n {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--accent);
  display: block;
}
.lv-btn .lv-d { font-size: 0.62rem; margin-top: 3px; line-height: 1.3; }

.mod-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.mod-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 10px 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  color: var(--grey);
  font-size: 0.78rem;
}
.mod-btn:hover, .mod-btn.sel {
  background: rgba(0,212,255,0.1);
  border-color: rgba(0,212,255,0.4);
  color: var(--white);
}
.mod-btn .mi { font-size: 1.2rem; display:block; margin-bottom:4px; }

.start-btn {
  width: 100%;
  max-width: 440px;
  padding: 15px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none;
  border-radius: 14px;
  color: var(--bg);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 24px rgba(0,212,255,0.3);
  margin-top: 4px;
}
.start-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(0,212,255,0.4); }

/* ── GAME SCREEN ── */
#screenGame {
  padding: 0;
  position: relative;
}

.game-hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 12px;
  z-index: 10;
  pointer-events: none;
}
.hud-pill {
  background: rgba(6,13,26,0.8);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 10px;
  padding: 6px 12px;
  text-align: center;
}
.hud-lbl { font-size: 0.6rem; color: var(--grey); letter-spacing: 1px; text-transform: uppercase; }
.hud-val {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
}

/* Game canvas */
#gameCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

/* Center message overlay */
.game-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  pointer-events: none;
}
.overlay-box {
  background: rgba(6,13,26,0.9);
  border: 1px solid rgba(0,212,255,0.4);
  border-radius: 20px;
  padding: 24px 32px;
  text-align: center;
  max-width: 320px;
  box-shadow: 0 0 40px rgba(0,212,255,0.2);
}
.overlay-icon { font-size: 2rem; margin-bottom: 8px; }
.overlay-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.overlay-desc {
  font-size: 0.85rem;
  color: var(--white);
  margin-bottom: 12px;
  line-height: 1.5;
}
.countdown-big {
  font-family: 'Orbitron', sans-serif;
  font-size: 3rem;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(255,215,0,0.5);
  animation: countPulse 0.9s ease-in-out infinite;
}
@keyframes countPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* Timer bar */
.timer-bar-wrap {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,0.05);
  z-index: 10;
}
.timer-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  transition: width 0.1s linear;
  box-shadow: 0 0 8px rgba(0,212,255,0.6);
}

/* ── RESULT ── */
.result-card {
  width: 100%;
  max-width: 440px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,212,255,0.2);
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  margin: 16px 0;
  animation: fadeUp 0.4s ease forwards;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
.result-icon { font-size: 3rem; display:block; margin-bottom:10px; }
.result-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.3rem;
  font-weight: 900;
  margin-bottom: 6px;
}
.result-title.ok { color: var(--green); text-shadow:0 0 20px rgba(0,255,136,0.4); }
.result-title.fail { color: var(--red); text-shadow:0 0 20px rgba(255,68,102,0.4); }
.result-sub { color: var(--grey); font-size:0.85rem; margin-bottom:16px; }
.result-pts {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 4px;
}
.streak-msg { font-size:0.82rem; color: var(--accent); min-height:18px; margin-bottom:16px; font-weight:600; }
.stats-row {
  display: flex;
  justify-content: space-around;
  padding: 14px 0;
  border-top: 1px solid rgba(255,255,255,0.07);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 20px;
}
.stat-n { font-family:'Orbitron',sans-serif; font-size:1.1rem; font-weight:700; color:var(--accent); }
.stat-l { font-size:0.68rem; color:var(--grey); margin-top:2px; }
.btn-row { display:flex; gap:10px; justify-content:center; }
.btn-play {
  flex:1; max-width:200px; padding:13px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border:none; border-radius:12px;
  color:var(--bg); font-family:'Orbitron',sans-serif;
  font-size:0.82rem; font-weight:700; cursor:pointer;
  transition:all 0.2s;
}
.btn-play:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,212,255,0.3); }
.btn-back {
  flex:1; max-width:160px; padding:13px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px; color:var(--grey);
  font-family:'Orbitron',sans-serif; font-size:0.72rem; font-weight:700;
  cursor:pointer; transition:all 0.2s;
}
.btn-back:hover { background:rgba(255,255,255,0.1); color:var(--white); }

@media(max-width:480px) {
  .level-grid { grid-template-columns:repeat(3,1fr); }
  .overlay-box { padding:18px 20px; max-width:280px; }
}
</style>
</head>
<body>

<!-- Background starfield canvas -->
<canvas id="bgCanvas"></canvas>

<div id="app">
  <div class="header">
    <div class="logo">OKU<span>BİT</span></div>
    <div class="score-pill">⚡ <span id="hScore">0</span></div>
  </div>

  <!-- ══ MENU ══ -->
  <div id="screenMenu" class="screen active">
    <div class="meteor-preview">☄️</div>
    <div class="game-title">METEOR TAKİBİ</div>
    <div class="game-sub">SMOOTH PURSUIT TRACKING</div>

    <div class="menu-card">
      <h3>SEVİYE</h3>
      <div class="level-grid">
        <div class="lv-btn sel" onclick="selLv(1,this)">
          <span class="lv-n">1</span>
          <span class="lv-d">3 meteor<br>5sn</span>
        </div>
        <div class="lv-btn" onclick="selLv(2,this)">
          <span class="lv-n">2</span>
          <span class="lv-d">5 meteor<br>8sn</span>
        </div>
        <div class="lv-btn" onclick="selLv(3,this)">
          <span class="lv-n">3</span>
          <span class="lv-d">7 meteor<br>10sn</span>
        </div>
        <div class="lv-btn" onclick="selLv(4,this)">
          <span class="lv-n">4</span>
          <span class="lv-d">9 meteor<br>15sn</span>
        </div>
        <div class="lv-btn" onclick="selLv(5,this)">
          <span class="lv-n">5</span>
          <span class="lv-d">12 meteor<br>20sn</span>
        </div>
      </div>
    </div>

    <div class="menu-card">
      <h3>OYUN MODU</h3>
      <div class="mod-grid">
        <div class="mod-btn sel" onclick="selMod(1,this)">
          <span class="mi">☄️</span>Tek Meteor
        </div>
        <div class="mod-btn" onclick="selMod(2,this)">
          <span class="mi">☄️☄️</span>Çift Meteor
        </div>
        <div class="mod-btn" onclick="selMod(3,this)">
          <span class="mi">🎨</span>Renk Takibi
        </div>
        <div class="mod-btn sel-always" onclick="selMod(4,this)" style="border-color:rgba(255,136,68,0.4);color:var(--orange)">
          <span class="mi">🌠</span>Premium Meteor
        </div>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">BAŞLAT ▶</button>
  </div>

  <!-- ══ GAME ══ -->
  <div id="screenGame" class="screen">
    <div class="game-hud">
      <div class="hud-pill">
        <div class="hud-lbl">Seviye</div>
        <div class="hud-val" id="hudLv">1</div>
      </div>
      <div class="hud-pill">
        <div class="hud-lbl">Aşama</div>
        <div class="hud-val" id="hudPhase">—</div>
      </div>
      <div class="hud-pill">
        <div class="hud-lbl">Seri</div>
        <div class="hud-val" id="hudStreak">0 🔥</div>

    <canvas id="gameCanvas"></canvas>

    <div class="timer-bar-wrap" id="timerBarWrap" style="display:none">

    <div class="game-overlay" id="gameOverlay">
      <div class="overlay-box" id="overlayBox">
        <div class="overlay-icon" id="oIcon">☄️</div>
        <div class="overlay-title" id="oTitle">HAZIR OL</div>
        <div class="overlay-desc" id="oDesc"></div>

      </div>

  <!-- ══ RESULT ══ -->
  <div id="screenResult" class="screen">
    <div class="result-card">
      <span class="result-icon" id="rIcon">🎉</span>
      <div class="result-title" id="rTitle">DOĞRU!</div>
      <div class="result-sub" id="rSub"></div>
      <div class="result-pts" id="rPts"></div>
      <div class="streak-msg" id="rStreak"></div>
      <div class="stats-row">
        <div><div class="stat-n" id="sCorrect">0</div><div class="stat-l">Doğru</div></div>
        <div><div class="stat-n" id="sWrong">0</div><div class="stat-l">Yanlış</div></div>
        <div><div class="stat-n" id="sTotal">0</div><div class="stat-l">Puan</div></div>
      </div>

</div>

<script>
// ══ BACKGROUND STARFIELD ══
(function() {
  const c = document.getElementById('bgCanvas');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  function initStars() {
    stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random(),
        da: (Math.random() - 0.5) * 0.008
      });
    }
  }
  function drawBg() {
    ctx.clearRect(0,0,c.width,c.height);
    const g = ctx.createRadialGradient(c.width/2,c.height/2,0,c.width/2,c.height/2,c.width*0.8);
    g.addColorStop(0,'#0a1628'); g.addColorStop(1,'#060d1a');
    ctx.fillStyle = g; ctx.fillRect(0,0,c.width,c.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,230,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawBg);
  }
  resize(); initStars(); drawBg();
  window.addEventListener('resize', () => { resize(); initStars(); });
})();

// ══ GAME STATE ══
const G = {
  level:1, mod:1,
  score:0, streak:0, correct:0, wrong:0,
  meteors:[], target:[], phase:'',
  animId:null, timerStart:0, timerDur:0,
  canvasW:0, canvasH:0
};

const LEVELS = {
  1:{count:3, speedMul:0.6, dur:5000},
  2:{count:5, speedMul:1.0, dur:8000},
  3:{count:7, speedMul:1.4, dur:10000},
  4:{count:9, speedMul:1.8, dur:15000},
  5:{count:12, speedMul:2.4, dur:20000}
};

const COLORS = ['#00d4ff','#ffd700','#00ff88','#ff4466','#aa44ff','#ff8844','#ffffff','#44ffff'];
const COLOR_NAMES = {
  '#00d4ff':'Mavi','#ffd700':'Sarı','#00ff88':'Yeşil',
  '#ff4466':'Kırmızı','#aa44ff':'Mor','#ff8844':'Turuncu',
  '#ffffff':'Beyaz','#44ffff':'Camgöbeği'
};

// ── MENU ──
function selLv(n, el) {
  G.level = n;
  document.querySelectorAll('.lv-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}
function selMod(n, el) {
  G.mod = n;
  document.querySelectorAll('.mod-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

// ── GAME CANVAS ──
const gc = document.getElementById('gameCanvas');
const gctx = gc.getContext('2d');

function resizeGameCanvas() {
  const wrap = document.getElementById('screenGame');
  gc.width = wrap.offsetWidth || window.innerWidth;
  gc.height = wrap.offsetHeight || window.innerHeight;
  G.canvasW = gc.width;
  G.canvasH = gc.height;
}

// ── METEOR OBJECT ──
function makeMeteor(idx, total, colorOverride) {
  const lv = LEVELS[G.level];
  const margin = 60;
  const x = margin + Math.random() * (G.canvasW - margin*2);
  const y = margin + Math.random() * (G.canvasH - margin*2);
  const angle = Math.random() * Math.PI * 2;
  const speed = (1.2 + Math.random() * 1.5) * lv.speedMul;
  const color = colorOverride || COLORS[idx % COLORS.length];
  const tail = [];
  return {
    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    color, tail, size: G.mod===4 ? 10 : 8,
    changeTimer: 0, changePeriod: 60 + Math.random()*80,
    isTarget: false, idx,
    glow: 0
  };
}

// ── MOVEMENT PATTERNS ──
function updateMeteor(m) {
  m.changeTimer++;
  if (m.changeTimer > m.changePeriod) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.sqrt(m.vx*m.vx + m.vy*m.vy);
    m.vx = Math.cos(angle) * spd;
    m.vy = Math.sin(angle) * spd;
    m.changeTimer = 0;
    m.changePeriod = 60 + Math.random()*80;
  }

  m.x += m.vx;
  m.y += m.vy;

  // Bounce off walls
  const pad = m.size + 4;
  if (m.x < pad) { m.vx = Math.abs(m.vx); m.x = pad; }
  if (m.x > G.canvasW-pad) { m.vx = -Math.abs(m.vx); m.x = G.canvasW-pad; }
  if (m.y < pad) { m.vy = Math.abs(m.vy); m.y = pad; }
  if (m.y > G.canvasH-pad) { m.vy = -Math.abs(m.vy); m.y = G.canvasH-pad; }

  // Trail
  m.tail.push({x:m.x, y:m.y});
  if (m.tail.length > 18) m.tail.shift();

  // Glow pulse for target
  if (m.isTarget) m.glow = (m.glow + 0.12) % (Math.PI*2);
}

// ── DRAW ──
function drawFrame() {
  gctx.clearRect(0,0,G.canvasW,G.canvasH);

  G.meteors.forEach(m => {
    // Draw tail
    if (m.tail.length > 1) {
      for (let i=1; i<m.tail.length; i++) {
        const t = i / m.tail.length;
        gctx.beginPath();
        gctx.moveTo(m.tail[i-1].x, m.tail[i-1].y);
        gctx.lineTo(m.tail[i].x, m.tail[i].y);
        gctx.strokeStyle = m.color.replace(')',`,${t*0.5})`).replace('rgb','rgba').replace('#','');
        // simpler approach:
        const hex = m.color;
        const alpha = t * 0.45;
        gctx.strokeStyle = hexAlpha(hex, alpha);
        gctx.lineWidth = m.size * 0.5 * t;
        gctx.lineCap = 'round';
        gctx.stroke();
      }
    }

    // Main meteor body
    if (G.mod === 4) {
      drawMeteorShape(m);
    } else {
      // Circle meteor
      gctx.beginPath();
      gctx.arc(m.x, m.y, m.size, 0, Math.PI*2);
      const grad = gctx.createRadialGradient(m.x-m.size*0.3,m.y-m.size*0.3,0,m.x,m.y,m.size);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, m.color);
      grad.addColorStop(1, hexAlpha(m.color, 0.3));
      gctx.fillStyle = grad;
      gctx.fill();
    }

    // Glow for target meteor (during tracking phase)
    if (m.isTarget && G.phase === 'tracking') {
      const pulse = Math.sin(m.glow) * 0.5 + 0.5;
      gctx.beginPath();
      gctx.arc(m.x, m.y, m.size + 10 + pulse*6, 0, Math.PI*2);
      gctx.strokeStyle = hexAlpha(m.color, 0.0); // invisible during tracking
      gctx.lineWidth = 2;
      gctx.stroke();
    }

    // Label during selection phase
    if (G.phase === 'select') {
      gctx.font = 'bold 13px Orbitron, monospace';
      gctx.textAlign = 'center';
      gctx.fillStyle = '#ffffff';
      gctx.fillText(String.fromCharCode(65 + m.idx), m.x, m.y - m.size - 8);
    }
  });
}

function drawMeteorShape(m) {
  // Premium meteor: elongated shape with rock texture feel
  gctx.save();
  gctx.translate(m.x, m.y);
  const angle = Math.atan2(m.vy, m.vx);
  gctx.rotate(angle);

  const grad = gctx.createRadialGradient(-m.size*0.2,0,0,0,0,m.size*1.3);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop(0.3, m.color);
  grad.addColorStop(1, hexAlpha(m.color,0.2));

  gctx.beginPath();
  gctx.ellipse(0,0,m.size*1.5,m.size*0.85,0,0,Math.PI*2);
  gctx.fillStyle = grad;
  gctx.fill();

  // Craters
  gctx.beginPath();
  gctx.arc(m.size*0.3, -m.size*0.2, m.size*0.2,0,Math.PI*2);
  gctx.strokeStyle=hexAlpha('#ffffff',0.25);
  gctx.lineWidth=1;
  gctx.stroke();

  gctx.restore();
}

function hexAlpha(hex, alpha) {
  // Convert hex color to rgba
  let r=0,g=0,b=0;
  if (hex.length===7) {
    r=parseInt(hex.slice(1,3),16);
    g=parseInt(hex.slice(3,5),16);
    b=parseInt(hex.slice(5,7),16);
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── MAIN LOOP ──
let loopActive = false;
function gameLoop() {
  if (!loopActive) return;
  G.meteors.forEach(updateMeteor);
  drawFrame();
  // Update timer bar
  if (G.phase === 'tracking') {
    const elapsed = Date.now() - G.timerStart;
    const pct = Math.max(0, 1 - elapsed/G.timerDur);
    document.getElementById('timerBar').style.width = (pct*100)+'%';
  }
  G.animId = requestAnimationFrame(gameLoop);
}

// ── START GAME ──
function startGame() {
  showScreen('screenGame');
  setTimeout(() => {
    resizeGameCanvas();
    initMeteors();
    showOverlay();
  }, 100);
}

function initMeteors() {
  const lv = LEVELS[G.level];
  G.meteors = [];
  for (let i=0; i<lv.count; i++) {
    const color = G.mod===3 ? COLORS[i%COLORS.length] : COLORS[i%COLORS.length];
    G.meteors.push(makeMeteor(i, lv.count, color));
  }
  // Pick target(s)
  G.target = [];
  if (G.mod===2) {
    // Two targets
    const a = Math.floor(Math.random()*G.meteors.length);
    let b = a;
    while (b===a) b=Math.floor(Math.random()*G.meteors.length);
    G.target=[a,b];
    G.meteors[a].isTarget=true;
    G.meteors[b].isTarget=true;
  } else {
    const t = Math.floor(Math.random()*G.meteors.length);
    G.target=[t];
    G.meteors[t].isTarget=true;
  }
}

// ── OVERLAY / PHASE CONTROL ──
function showOverlay() {
  G.phase = 'intro';
  document.getElementById('gameOverlay').style.display='flex';
  document.getElementById('timerBarWrap').style.display='none';
  document.getElementById('hudPhase').textContent='Hazır';
  document.getElementById('hudLv').textContent=G.level;
  document.getElementById('hudStreak').textContent=G.streak+' 🔥';

  // Build target description
  let desc = '';
  if (G.mod===1||G.mod===4) {
    const t = G.meteors[G.target[0]];
    const colorName = COLOR_NAMES[t.color]||'';
    desc = `<strong>${colorName}</strong> meteoru takip et`;
  } else if (G.mod===2) {
    const t1 = G.meteors[G.target[0]];
    const t2 = G.meteors[G.target[1]];
    desc = `<strong>${COLOR_NAMES[t1.color]}</strong> ve <strong>${COLOR_NAMES[t2.color]}</strong> meteorları takip et`;
  } else if (G.mod===3) {
    const t = G.meteors[G.target[0]];
    desc = `<strong style="color:${t.color}">${COLOR_NAMES[t.color]||'Renkli'}</strong> meteoru takip et`;
  }

  setOverlay('☄️','TAKİP ET',desc,null);

  // Start animation immediately (so meteors are visible behind overlay)
  loopActive=true;
  G.phase='show_target';
  gameLoop();

  // After 2s, countdown
  setTimeout(()=>runCountdown(3),2000);
}

function setOverlay(icon,title,desc,count) {
  document.getElementById('oIcon').textContent=icon;
  document.getElementById('oTitle').textContent=title;
  document.getElementById('oDesc').innerHTML=desc||'';
  const cd=document.getElementById('oCount');
  if (count!=null) { cd.style.display='block'; cd.textContent=count; }
  else cd.style.display='none';
}

function runCountdown(n) {
  if (n<=0) {
    document.getElementById('gameOverlay').style.display='none';
    startTracking();
    return;
  }
  setOverlay('','',`<span style="color:var(--grey);font-size:0.8rem">Meteoru gözünle takip et!</span>`,n);
  document.getElementById('oIcon').textContent='';
  document.getElementById('oTitle').textContent='';
  setTimeout(()=>runCountdown(n-1),900);
}

function startTracking() {
  G.phase='tracking';
  document.getElementById('hudPhase').textContent='Takip Et';
  const lv=LEVELS[G.level];
  G.timerStart=Date.now();
  G.timerDur=lv.dur;
  document.getElementById('timerBarWrap').style.display='block';
  // Un-glow targets (hide which is target during tracking)
  // They all look the same now — that's the challenge!
  G.meteors.forEach(m=>{ m.isTarget_hidden=m.isTarget; m.isTarget=false; });

  setTimeout(()=>stopTracking(), lv.dur);
}

function stopTracking() {
  G.phase='select';
  document.getElementById('hudPhase').textContent='Seç!';
  document.getElementById('timerBarWrap').style.display='none';
  // Show letter labels, enable click
  document.getElementById('gameOverlay').style.display='none';
  showSelectInstruction();
  gc.onclick=handleClick;
  gc.ontouchend=handleTouch;
}

function showSelectInstruction() {
  const box=document.getElementById('overlayBox');
  box.style.position='absolute';
  box.style.top='12px';
  box.style.pointerEvents='none';
  document.getElementById('gameOverlay').style.display='flex';
  document.getElementById('gameOverlay').style.pointerEvents='none';

  let msg='';
  if (G.mod===2) msg='İlk takip ettiğin meteoru seç';
  else msg='Takip ettiğin meteoru seç';
  setOverlay('🎯','SEÇME ZAMANI',msg,null);
}

// ── CLICK HANDLING ──
let selectCount=0;
let selectedTargets=[];

function handleClick(e) {
  const rect=gc.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;
  processTap(x,y);
}
function handleTouch(e) {
  e.preventDefault();
  const rect=gc.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=t.clientX-rect.left;
  const y=t.clientY-rect.top;
  processTap(x,y);
}

function processTap(x,y) {
  // Find closest meteor
  let closest=null, minD=Infinity;
  G.meteors.forEach(m=>{
    const d=Math.hypot(m.x-x,m.y-y);
    if(d<minD){ minD=d; closest=m; }
  });
  if(!closest||minD>60) return;

  if(G.mod===2) {
    // Need two selections
    selectCount++;
    selectedTargets.push(closest.idx);
    // Highlight selected
    gctx.beginPath();
    gctx.arc(closest.x,closest.y,closest.size+8,0,Math.PI*2);
    gctx.strokeStyle=hexAlpha('#ffd700',0.8);
    gctx.lineWidth=3;
    gctx.stroke();

    if(selectCount>=2) {
      gc.onclick=null; gc.ontouchend=null; selectCount=0;
      const correct = selectedTargets.includes(G.target[0]) && selectedTargets.includes(G.target[1]);
      selectedTargets=[];
      // Restore isTarget for reveal
      G.meteors.forEach(m=>{ m.isTarget=m.isTarget_hidden; });
      endRound(correct);
    } else {
      setOverlay('🎯','İKİNCİYİ SEÇ','İkinci meteoru seç',null);
    }
  } else {
    gc.onclick=null; gc.ontouchend=null;
    // Restore
    G.meteors.forEach(m=>{ m.isTarget=m.isTarget_hidden; });
    const correct = G.target.includes(closest.idx);
    endRound(correct);
  }
}

// ── REVEAL & END ──
function endRound(correct) {
  G.phase='reveal';
  loopActive=false;
  cancelAnimationFrame(G.animId);

  // Draw final frame with reveal
  drawReveal(correct);

  let pts=0;
  if(correct){
    G.correct++; G.streak++;
    pts=100;
    if(G.streak>=10) pts+=250;
    else if(G.streak>=5) pts+=100;
    else if(G.streak>=3) pts+=50;
    G.score+=pts;
  } else {
    G.wrong++; G.streak=0;
  }
  document.getElementById('hScore').textContent=G.score;

  setTimeout(()=>showResult(correct,pts),1200);
}

function drawReveal(correct) {
  drawFrame();
  G.meteors.forEach(m=>{
    if(m.isTarget) {
      // Green ring for target
      gctx.beginPath();
      gctx.arc(m.x,m.y,m.size+14,0,Math.PI*2);
      gctx.strokeStyle=correct?hexAlpha('#00ff88',0.9):hexAlpha('#ff4466',0.9);
      gctx.lineWidth=3;
      gctx.stroke();
      // Label
      gctx.font='bold 14px Orbitron,monospace';
      gctx.textAlign='center';
      gctx.fillStyle=correct?'#00ff88':'#ff4466';
      gctx.fillText(correct?'✓':'✗',m.x,m.y+5);
    }
  });
}

// ── RESULT SCREEN ──
function showResult(correct,pts) {
  showScreen('screenResult');
  document.getElementById('rIcon').textContent=correct?'🎉':'☄️';
  document.getElementById('rTitle').textContent=correct?'DOĞRU!':'KAÇIRDIN!';
  document.getElementById('rTitle').className='result-title '+(correct?'ok':'fail');
  document.getElementById('rSub').textContent=correct
    ?'Meteoru başarıyla takip ettin!'
    :'Meteor elinden kaçtı. Tekrar dene!';
  document.getElementById('rPts').textContent=correct?`+${pts} ⚡`:'';
  const sm=document.getElementById('rStreak');
  if(G.streak>=10) sm.textContent='🔥 10 Seri! +250 Bonus!';
  else if(G.streak>=5) sm.textContent='🔥 5 Seri! +100 Bonus!';
  else if(G.streak>=3) sm.textContent='🔥 3 Seri! +50 Bonus!';
  else sm.textContent='';
  document.getElementById('sCorrect').textContent=G.correct;
  document.getElementById('sWrong').textContent=G.wrong;
  document.getElementById('sTotal').textContent=G.score;
}

function playAgain() {
  loopActive=false;
  cancelAnimationFrame(G.animId);
  gc.onclick=null; gc.ontouchend=null;
  selectCount=0; selectedTargets=[];
  startGame();
}
function goMenu() {
  loopActive=false;
  cancelAnimationFrame(G.animId);
  gc.onclick=null; gc.ontouchend=null;
  selectCount=0; selectedTargets=[];
  showScreen('screenMenu');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screenGame') {
    document.getElementById('gameOverlay').style.pointerEvents='auto';
    document.getElementById('gameOverlay').style.position='absolute';
  }
}

window.addEventListener('resize',()=>{
  if(document.getElementById('screenGame').classList.contains('active')) {
    resizeGameCanvas();
  }
});
</script>
